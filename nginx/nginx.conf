# nginx reverse proxy + static file server for the Guestbook frontend.
#
# - "/"      -> serve the static index.html / app.js from this image.
# - "/api/"  -> reverse-proxy to the `api` service on port 5000.
#
# "api" below is a Docker Compose *service name*, resolved via Docker's
# embedded DNS because this nginx container shares `frontend-net` with
# the `api` container. nginx has NO route to `db` or `cache` (they only
# live on `backend-net`), which is the whole point of this demo.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
